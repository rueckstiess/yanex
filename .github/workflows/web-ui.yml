name: Web UI
on:
  pull_request:
    paths:
      - 'yanex/web/**'
      - '.github/workflows/web-ui.yml'
  push:
    paths:
      - 'yanex/web/**'
      - '.github/workflows/web-ui.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yanex/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yanex/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
